name: Private MCP gateway pilot
on:
  pull_request:
    paths:
      - "integrations/local-workspace-mcp/**"
      - ".github/workflows/local-workspace-mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/local-workspace-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source syntax
        run: python -m py_compile core.py server.py local_approve.py tests/test_core.py
      - name: Run isolated security tests
        run: python -m unittest discover -s tests -v
      - name: Install the official MCP SDK
        run: python -m pip install -r requirements.txt
      - name: Verify server import on MCP SDK v2
        run: |
          python - <<'PY'
          from mcp.server.mcpserver import MCPServer
          import server
          assert server.mcp is not None
          print("MCPServer import succeeded; stdio server not started")
          PY

  windows-bootstrap-syntax:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual MCP SDK for Windows import smoke test
        run: python -m pip install -r integrations/local-workspace-mcp/requirements.txt
      - name: Run bootstrap's MCP import test in Windows PowerShell
        shell: pwsh
        run: |
          & ./integrations/local-workspace-mcp/scripts/VERIFY_WINDOWS_GATEWAY.ps1 `
            -PythonExe (Get-Command python.exe).Source `
            -GatewayDir (Resolve-Path "integrations/local-workspace-mcp").Path
      - name: Run all gateway tests on Windows (verify SQLite handle cleanup)
        shell: pwsh
        run: python -m unittest discover -s integrations/local-workspace-mcp/tests -v
      - name: Parse Windows installers without running them
        shell: pwsh
        run: |
          $scripts = @(
            "integrations/local-workspace-mcp/scripts/BOOTSTRAP_WINDOWS.ps1",
            "integrations/local-workspace-mcp/scripts/INSTALL_TO_D.ps1",
            "integrations/local-workspace-mcp/scripts/VERIFY_WINDOWS_GATEWAY.ps1",
            "integrations/local-workspace-mcp/scripts/CONNECT_TUNNEL_WINDOWS.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse errors in $script"
            }
            Write-Host "PowerShell parser verified $script"
          }
