name: Private MCP gateway pilot
on:
  pull_request:
    paths:
      - "integrations/local-workspace-mcp/**"
      - ".github/workflows/local-workspace-mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/local-workspace-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source syntax
        run: python -m py_compile core.py server.py local_approve.py tests/test_core.py
      - name: Run isolated security tests
        run: python -m unittest discover -s tests -v
      - name: Install the official MCP SDK
        run: python -m pip install -r requirements.txt
      - name: Verify server advertises supported tools
        run: |
          python - <<'PY'
          import server
          assert server.mcp is not None
          print("MCPServer import succeeded; stdio server not started")
          PY
